name: Test and export prototype
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: thornwake-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install matching Godot editor and export templates
        shell: bash
        run: |
          set -euo pipefail
          download_root="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl --fail --location --retry 3 "$download_root/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
          curl --fail --location --retry 3 "$download_root/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q "$RUNNER_TEMP/templates.tpz" 'templates/android_debug.apk' 'templates/android_release.apk' 'templates/windows_debug_x86_64.exe' 'templates/windows_release_x86_64.exe' -d "$RUNNER_TEMP/templates"
          cp "$RUNNER_TEMP/templates/templates/"* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
      - name: Verify rules, saves, inventory and full expeditions
        run: python3 tools/run_checks.py --godot "$GODOT_BIN"
      - name: Export Windows debug build and resource pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p builds
          "$GODOT_BIN" --headless --path . --export-debug 'Windows Desktop' builds/Thornwake.exe
          "$GODOT_BIN" --headless --path . --export-pack 'Windows Desktop' builds/Thornwake-v0.6.0.pck
      - name: Configure existing Android SDK and debug signing
        shell: bash
        env:
          TEST_KEYSTORE_BASE64: ${{ secrets.THORNWAKE_TEST_KEYSTORE_BASE64 }}
          TEST_CERT_SHA256: ${{ secrets.THORNWAKE_TEST_CERT_SHA256 }}
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/build-tools"
          java_path="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          if [ -n "$TEST_KEYSTORE_BASE64" ]; then
            test -n "$TEST_CERT_SHA256"
            printf '%s' "$TEST_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/thornwake-debug.keystore"
            echo "TEST_CERT_SHA256=$TEST_CERT_SHA256" >> "$GITHUB_ENV"
            echo "SIGNING_MODE=retained private test identity" >> "$GITHUB_ENV"
          else
            "$java_path/bin/keytool" -genkeypair -noprompt -keystore "$RUNNER_TEMP/thornwake-debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Thornwake Disposable Test"
            echo "SIGNING_MODE=disposable test identity; update compatibility not guaranteed" >> "$GITHUB_ENV"
          fi
          "$java_path/bin/keytool" -list -keystore "$RUNNER_TEMP/thornwake-debug.keystore" -storepass android
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$java_path"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$RUNNER_TEMP/thornwake-debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
      - name: Export Android debug APK
        run: '"$GODOT_BIN" --headless --path . --export-debug Android builds/Thornwake-debug.apk'
      - name: Verify APK signature and report signing mode
        shell: bash
        run: |
          set -euo pipefail
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$build_tools/apksigner" verify --verbose --print-certs builds/Thornwake-debug.apk > builds/Android-signing.txt
          python3 - <<'PYVERIFY'
          from pathlib import Path
          import os
          expected = os.environ.get('TEST_CERT_SHA256', '').replace(':', '').lower()
          actual = Path('builds/Android-signing.txt').read_text().replace(':', '').lower()
          if expected:
              assert expected in actual, 'APK signing identity changed'
          with Path('builds/Android-signing.txt').open('a') as report:
              report.write('\nSigning mode: ' + os.environ['SIGNING_MODE'] + '\n')
          print(os.environ['SIGNING_MODE'])
          PYVERIFY
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: Thornwake-v0.6.0-test-builds
          path: |
            builds/
            tests/balance_results.json
            tests/economy_results.json
            tests/balance_matrix.json
          if-no-files-found: warn
          retention-days: 14
